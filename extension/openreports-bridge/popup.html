<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenReports Bridge</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{width:340px;margin:0;background:#f6f7f9;color:#20242b;font:13px system-ui,-apple-system,'Segoe UI',sans-serif}main{padding:18px}header{display:flex;align-items:center;gap:10px;margin-bottom:18px}.logo{height:38px;width:38px;border-radius:12px;background:#252c36;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}.sub{color:#78808d;font-size:11px}h1{font-size:16px;margin:0 0 2px}section{background:white;border:1px solid #e2e5ea;border-radius:14px;padding:14px;box-shadow:0 4px 14px #141a2310}label{display:block;margin:12px 0 6px;color:#59616c;font-weight:600}input,select{width:100%;border:1px solid #d8dce2;padding:9px;border-radius:8px;font:inherit}button{border:0;border-radius:9px;cursor:pointer;padding:11px;font:inherit;font-weight:650}.primary{width:100%;margin-top:16px;background:#242c37;color:white}.secondary{width:100%;background:#e8ebef;color:#303742;margin-top:8px}button:disabled{opacity:.4;cursor:not-allowed}.status{margin-top:12px;line-height:1.5;color:#5f6670;overflow-wrap:anywhere}.note{margin-top:12px;font-size:11px;line-height:1.5;color:#7b8390}.mr-period-date,.mr-period-clock{display:flex;align-items:center;gap:3px}
.mr-period-date select{flex:1;min-width:0;width:auto;padding:8px 3px;text-align:center}.mr-period-date select:last-child{flex:1.4}
.mr-period-clock input{flex:1;width:0;text-align:center;min-width:0;font-variant-numeric:tabular-nums}
.mr-period-separator{color:#697386}.error{color:#ba3030}.success{color:#137a50}
</style></head><body><main><header><div class="logo">Mr</div><div><h1>OpenReports Bridge</h1><div class="sub">AL_AUDYT / GODZINY_MDT · v0.3.1</div></div></header><section><label for="report" data-mr-tr="reportModule">Raport / moduł</label><select id="report" style="width:100%;border:1px solid #d8dce2;padding:9px;border-radius:8px;font:inherit"><option value="ai_audyt">AL_AUDYT / FORMATKA_59</option><option value="godziny_mdt">GODZINY_MDT</option></select><label for="from" data-mr-tr="dateFrom">Data od</label><div id="period-from-date"></div><label for="time-from" data-mr-tr="timeFromFull">Godzina od (HH:MM:SS)</label><div id="period-from-time"></div><label for="to" data-mr-tr="dateTo">Data do</label><div id="period-to-date"></div><label for="time-to" data-mr-tr="timeToFull">Godzina do (HH:MM:SS)</label><div id="period-to-time"></div><button id="start" class="primary" data-mr-tr="startPopup">Pobierz z OpenReports</button><button id="cancel" class="secondary" hidden data-mr-tr="cancel">Anuluj</button><div id="status" class="status" role="status" aria-live="polite"></div><div class="note" data-mr-tr="popupNote"></div></section></main><script src="i18n.js"></script><script src="popup.js"></script></body></html>
